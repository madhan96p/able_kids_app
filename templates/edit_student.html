{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-header bg-primary text-white">Edit Student Profile</div>
        <div class="card-body">
            <form action="/update_student/{{ student.id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Student Name</label>
                    <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Roll Number</label>
                    <input type="text" name="roll_no" class="form-control" value="{{ student.roll_no }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="Male" {% if student.gender=='Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if student.gender=='Female' %}selected{% endif %}>Female</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Batch</label>
                    <select name="batch_id" class="form-select">
                        {% for b in batches_list %}
                        <option value="{{ b.id }}" {% if student.batch_id==b.id %}selected{% endif %}>{{ b.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Update Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
