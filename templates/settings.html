{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4"><i class="bi bi-gear-fill me-2"></i>Admin Settings</h2>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-dark text-white">App Configuration</div>
                <div class="card-body">
                    <form action="/settings" method="POST">
                        <label class="form-label fw-bold">Maximum Stages</label>
                        <div class="input-group mb-3">
                            <input type="number" name="total_stages" class="form-control" value="{{ stages }}">
                            <button class="btn btn-primary" type="submit">Update</button>
                        </div>
                        <small class="text-muted">Currently set to 1-{{ stages }}</small>
                    </form>
                </div>
            </div>
            
            <div class="d-grid gap-2">
                <a href="/students" class="btn btn-outline-primary btn-lg">
                    <i class="bi bi-people-fill me-2"></i> Manage Students
                </a>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Manage Categories</h5>
                    <button class="btn btn-sm btn-light" data-bs-toggle="modal" data-bs-target="#addCatModal">
                        <i class="bi bi-plus-lg"></i> Add New
                    </button>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Category Name</th>
                                <th>Group</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for cat in categories %}
                            <tr>
                                <td>{{ cat.name }}</td>
                                <td><span class="badge bg-light text-dark border">{{ cat.group }}</span></td>
                                <td class="text-end">
                                    <a href="#" class="text-danger"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addCatModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" action="/settings/add_category" method="POST">
            <div class="modal-header">
                <h5 class="modal-title">Add Behavioral Domain</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Category Name</label>
                    <input type="text" name="cat_name" class="form-control" placeholder="e.g. Locomotion" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Group</label>
                    <select name="cat_group" class="form-select">
                        <option value="Physical">Physical/Motor</option>
                        <option value="Self-Help">Self-Help</option>
                        <option value="Social">Social/Academic</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Save Category</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
