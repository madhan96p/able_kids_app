<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 600px;">
            <div class="card-header bg-warning">
                <h4 class="mb-0">Edit Progress Entry</h4>
            </div>
            <div class="card-body">
                <form action="/update/{{ record.id }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <input type="text" name="category" class="form-control" value="{{ record.category }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stage (1-{{ total_stages }})</label>
                        <input type="number" name="stage" class="form-control" min="1" max="{{ total_stages }}"
                            value="{{ record.stage }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="3">{{ record.notes }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Update Record</button>
                    <a href="/student/{{ record.student_id }}" class="btn btn-link w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
